# config.yaml
# ============================================================
# Paths
# ============================================================
paths:
  vault_path: "/vault"
  data_path: "/app/data"
  db_path: "/app/data/app.db"              # SQLite database path

# ============================================================
# Service URLs
# ============================================================
urls:
  llm_url: "http://host.docker.internal:1234/v1"
  embeddings_url: "http://host.docker.internal:1234/v1/embeddings"
  reranker_url: "http://host.docker.internal:8001/rerank"

# ============================================================
# Models
# ============================================================
models:
  llm_model: "t-lite-it-2.1"
  embeddings_model: "text-embedding-user-bge-m3"
  reranker_model: "nvidia/Llama-Nemotron-Rerank-1B-v2"

# ============================================================
# Embeddings
# ============================================================
embeddings:
  dimension: 1024                            # Vector dimension for bge-m3

# ============================================================
# Indexing
# ============================================================
indexing:
  chunk_size: 600
  chunk_overlap: 100
  batch_size: 16

# ============================================================
# Search
# ============================================================
search:
  top_k_retrieval: 50                        # Candidate count before reranking
  top_k_rerank: 12                           # Result count after reranking
  min_relevance: 0.5                         # Minimum relevance score for sources
  bm25_weight: 0.3                           # BM25 weight in hybrid search
  rrf_k: 60                                  # Reciprocal Rank Fusion constant

# ============================================================
# Chat
# ============================================================
chat:
  default_title: "Без названия"              # Default title for new chats
  title_max_length: 50                       # Maximum auto-title length
  context_limit: 20                          # Number of recent messages passed to LLM

# ============================================================
# LLM
# ============================================================
llm:
  max_tokens: 8192
  temperature: 0.2
