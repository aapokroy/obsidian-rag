version: '3.8'

services:
  obsidian-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-rag
    ports:
      - "8000:8000"
    environment:
      - CHROMA_TELEMETRY_IMPL=none
    volumes:
      - ${VAULT_PATH:-./vault}:/vault:ro
      - ./chroma_db:/app/chroma_db
      - ./chats:/app/chats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
