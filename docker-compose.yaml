version: '3.8'

services:
  obsidian-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-rag
    ports:
      - "8000:8000"
    volumes:
      - ${VAULT_PATH:-./vault}:/vault:ro
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
