services:
  obsidian-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-rag
    ports:
      - "8000:8000"
    volumes:
      - ${VAULT_PATH:-./vault}:/vault:ro
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
